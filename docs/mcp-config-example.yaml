# MCP 服务器配置示例
#
# 在 config.yaml 中添加 mcp 部分即可启用 MCP 服务器。
# MCP 工具会自动注册到 ToolRegistry 和 ToolIndex，
# LLM 通过 tool_search 发现、tool_executor 调用。

mcp:
  servers:
    # ─── stdio 传输（子进程）──────────────────────────────

    # 示例 1: 使用 npx 启动 MCP 服务器
    - name: filesystem
      transport: stdio
      enabled: true
      command: npx
      args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
      timeout: 30
      auto_approve: []  # 留空表示所有工具都需要审批

    # 示例 2: 使用 uvx 启动
    - name: github
      transport: stdio
      enabled: true
      command: uvx
      args: ["mcp-server-github"]
      env:
        GITHUB_TOKEN: "your-token-here"
      timeout: 30

    # 示例 3: 使用 python 直接启动
    - name: my-custom-server
      transport: stdio
      enabled: false
      command: python
      args: ["-m", "my_mcp_server"]
      cwd: "/path/to/server"
      timeout: 15

    # ─── streamable-http 传输 ─────────────────────────────

    # 示例 4: 远程 HTTP 服务
    - name: remote-tools
      transport: streamable_http
      enabled: false
      url: "http://localhost:3001/mcp"
      headers:
        Authorization: "Bearer your-token"
      timeout: 30
